name: Build realme GT Neo5 kernel (GKI 5.10.226 + Droidspaces)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/google-chrome /opt/microsoft-msedge
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo ccache bc bison ca-certificates curl flex gcc git libssl-dev lld llvm make ninja-build python3 zip patch
          git config --global user.name "builder"
          git config --global user.email "builder@localhost"

      - name: Sync ACK GKI build environment (manifest common-android12-5.10)
        run: |
          mkdir -p $HOME/ak && cd $HOME/ak
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c -j$(nproc)
          ls build/ | head -5

      - name: Replace common with realme GT Neo5 official source (kernel-5.10.226)
        run: |
          cd $HOME/ak
          rm -rf common
          git clone --depth=1 -b kernel-5.10.226 https://github.com/realme-kernel-opensource/realme_gt_neo5-AndroidV-kernel-source common
          # 补上与手机 vendor 模块 vermagic 一致的版本串尾巴
          echo "-o-gca7e70f5a6e7" > common/localversion-oplus
          # 确保同时编译未压缩 Image（设备 boot 内核段为 raw 格式）
          sed -i 's/^MAKE_GOALS="${MAKE_GOALS}$/MAKE_GOALS="${MAKE_GOALS}\nImage/' common/build.config.gki.aarch64

      - name: Fix stripped proprietary code references (oplus_binder / cc-wrapper)
        run: |
          cd $HOME/ak/common
          # 1) 删除指向 OPPO 私有仓库的悬空 symlink（git clone 后不可用）
          echo "=== 悬空 symlink ==="
          find . -xtype l -print -delete
          # 2) 注释掉 Makefile 中引用已删除目录的行（make clean 会遍历所有 obj 目录，即使 CONFIG 未开启）
          sed -i 's|^\(obj-.*oplus_binder/\)|# STRIPPED: \1|' drivers/android/Makefile
          grep -n "oplus_binder" drivers/android/Makefile || true
          # 3) 重建被 strip 的 cc-wrapper（Makefile 604 行: CC := scripts/basic/cc-wrapper $(CC)），透传即可
          if ! [ -f scripts/basic/cc-wrapper ] && grep -q "scripts/basic/cc-wrapper" Makefile; then
            printf '#!/bin/sh\nexec "$@"\n' > scripts/basic/cc-wrapper
            chmod +x scripts/basic/cc-wrapper
            echo "cc-wrapper stub 已创建"
          fi
          ls -la scripts/basic/cc-wrapper

          # 4) 自动修复所有 Kconfig 中 source 不存在文件（被 strip 的私有 Kconfig）
          #    Kconfig 的 source 无论 CONFIG 依赖是否满足都会读文件，缺失即 defconfig 失败
          python3 - << 'PYEOF'
          import os, re, sys
          root = os.getcwd()
          total = 0
          for dirpath, dirs, files in os.walk(root):
            dirs[:] = [d for d in dirs if d != '.git']
            for fn in files:
              if not fn.startswith('Kconfig'):
                continue
              path = os.path.join(dirpath, fn)
              rel = os.path.relpath(path, root)
              with open(path, 'r', errors='ignore') as f:
                lines = f.readlines()
              changed = False
              for i, line in enumerate(lines):
                m = re.match(r'^(\s*)(source|rsource)\s+"?([^"\s]+)"?', line)
                if not m:
                  continue
                p = m.group(3)
                if '$(' in p:  # 含变量的 source 无法静态解析，跳过
                  continue
                # Kconfig 语义：先按当前文件目录找，找不到回退内核根目录（srctree）
                # 两个位置都不存在才算被 strip，否则会误删合法 source（run8 教训：
                # arch/arm64/Kconfig 的 source "arch/Kconfig" 被误删，丢失 64BIT/HZ）
                full = os.path.normpath(os.path.join(dirpath, p))
                if not os.path.exists(full) and not os.path.exists(os.path.join(root, p)):
                  lines[i] = m.group(1) + '# STRIPPED: ' + line.lstrip()
                  print('FIX %s:%d source缺失: %s' % (rel, i + 1, p))
                  changed = True
                  total += 1
              if changed:
                with open(path, 'w') as f:
                  f.writelines(lines)
          print('共修复缺失 source:', total)
          sys.exit(0)
          PYEOF

          # 5) 修复 realme 树 mm/vmscan.c 的声明事故（官方开源时 strip）：
          #    shrink_lruvec() 的 bool scan_adjusted; 声明丢失，而原有的
          #    bool proportional_reclaim; 全文件零使用（使用代码也被 strip），
          #    保留会在 -Werror 下报 unused variable（run10 教训），直接替换
          if grep -q 'bool proportional_reclaim;' mm/vmscan.c; then
            sed -i 's|^\tbool proportional_reclaim;$|\tbool scan_adjusted;|' mm/vmscan.c && echo "vmscan.c 已将死声明 proportional_reclaim 替换为 scan_adjusted"
          elif ! grep -q 'bool scan_adjusted;' mm/vmscan.c; then
            sed -i 's|^\tunsigned long nr_to_reclaim = sc->nr_to_reclaim;$|\tunsigned long nr_to_reclaim = sc->nr_to_reclaim;\n\tbool scan_adjusted;|' mm/vmscan.c && echo "vmscan.c 已补 scan_adjusted 声明"
          fi

          # 6) 自动修复 Makefile/Kbuild 中引用被 strip 目录的 obj 项（run11 教训：
          #    drivers/soc/oplus/storage/Makefile 缺失但被 obj-y += storage/ 引用）
          #    目录存在但无 Makefile/Kbuild，或目录不存在，都视为被 strip，从 += 列表中剔除
          python3 - << 'PYEOF'
          import os, re
          root = os.getcwd()
          total = 0
          for dirpath, dirs, files in os.walk(root):
            dirs[:] = [d for d in dirs if d != '.git']
            for fn in files:
              if fn not in ('Makefile', 'Kbuild'):
                continue
              path = os.path.join(dirpath, fn)
              rel = os.path.relpath(path, root)
              with open(path, 'r', errors='ignore') as f:
                lines = f.readlines()
              changed = False
              for i, line in enumerate(lines):
                if line.lstrip().startswith('#') or '+=' not in line:
                  continue
                lhs, rhs = line.split('+=', 1)
                hash_pos = rhs.find('#')
                if hash_pos >= 0:
                  code, comment = rhs[:hash_pos], rhs[hash_pos:]
                else:
                  code, comment = rhs, ''
                tokens = code.split()
                dir_tokens = [t for t in tokens if t.endswith('/') and '$' not in t]
                if not dir_tokens:
                  continue
                kept = []
                dropped = []
                for t in tokens:
                  if t.endswith('/') and '$' not in t:
                    d = os.path.normpath(os.path.join(dirpath, t.rstrip('/')))
                    if not (os.path.exists(os.path.join(d, 'Makefile')) or os.path.exists(os.path.join(d, 'Kbuild'))):
                      dropped.append(t)
                      continue
                  kept.append(t)
                if dropped:
                  total += len(dropped)
                  print('FIX %s: 剔除 %s' % (rel, dropped))
                  kept_suffix = ' ' + comment.strip() if comment.strip() else ''
                  if kept:
                    lines[i] = lhs.rstrip() + ' += ' + ' '.join(kept) + kept_suffix + '\n'
                  else:
                    lines[i] = '# STRIPPED: ' + line.lstrip()
                  changed = True
              if changed:
                with open(path, 'w') as f:
                  f.writelines(lines)
          print('共剔除被 strip 目录引用:', total)
          PYEOF

          # 7) 修复 drivers/thermal/thermal_sysfs.c 缺 <linux/mm.h> 包含
          #    （kvzalloc/kvfree 隐式声明，realme 树该文件 include 列表不全）
          if ! grep -q 'linux/mm.h' drivers/thermal/thermal_sysfs.c; then
            sed -i 's|^#include <linux/slab.h>$|#include <linux/slab.h>\n#include <linux/mm.h>|' drivers/thermal/thermal_sysfs.c && echo "thermal_sysfs.c 已补 linux/mm.h"
          fi

      - name: Apply Droidspaces kABI patches (required for 5.10)
        run: |
          cd $HOME/ak/common
          BASE="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
          ok=""
          for p in 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch 001.GKI-below-6.12-fix_sysvipc_kabi_1_2_3.patch 001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch; do
            echo ">>> 尝试 $p"
            curl -fsSL -o /tmp/p1.patch "$BASE/$p" || continue
            if patch -p1 --forward --batch < /tmp/p1.patch; then ok="$p"; break; fi
            patch -p1 -R --batch < /tmp/p1.patch 2>/dev/null || true
          done
          [ -n "$ok" ] || { echo "SYSVIPC kABI 补丁全部应用失败"; exit 1; }
          echo ">>> SYSVIPC 补丁成功: $ok"
          curl -fsSL -o /tmp/p2.patch "$BASE/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          patch -p1 --forward --batch < /tmp/p2.patch
          echo ">>> POSIX_MQUEUE 补丁成功"

      - name: Enable Droidspaces options in gki_defconfig (kABI-safe list only)
        run: |
          cd $HOME/ak/common/arch/arm64/configs
          # 文档明确警告：不要开启 CFS_BANDWIDTH / CGROUP_PIDS（破坏 kABI）
          OPTS="CONFIG_SYSVIPC=y CONFIG_POSIX_MQUEUE=y CONFIG_IPC_NS=y CONFIG_PID_NS=y \
          CONFIG_DEVTMPFS=y CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y \
          CONFIG_USER_NS=y CONFIG_IP6_NF_NAT=y CONFIG_IP6_NF_TARGET_MASQUERADE=y \
          CONFIG_NETFILTER_XT_TARGET_REJECT=y CONFIG_NETFILTER_XT_TARGET_LOG=y CONFIG_NETFILTER_XT_MATCH_RECENT=y \
          CONFIG_IP_SET=y CONFIG_IP_SET_HASH_IP=y CONFIG_IP_SET_HASH_NET=y CONFIG_NETFILTER_XT_SET=y \
          CONFIG_TMPFS_POSIX_ACL=y CONFIG_TMPFS_XATTR=y"
          for opt in $OPTS; do
            name="${opt%%=*}"
            if grep -qE "^# ${name} is not set" gki_defconfig; then
              sed -i "s/^# ${name} is not set/${opt}/" gki_defconfig
              echo "修改: $opt"
            elif ! grep -qE "^${opt}$" gki_defconfig; then
              echo "$opt" >> gki_defconfig
              echo "追加: $opt"
            else
              echo "已存在: $opt"
            fi
          done
          echo "=== 确认结果 ==="
          grep -E "CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|USER_NS|IP6_NF_NAT|IP6_NF_TARGET_MASQUERADE|NETFILTER_XT_TARGET_REJECT|NETFILTER_XT_TARGET_LOG|NETFILTER_XT_MATCH_RECENT|IP_SET|IP_SET_HASH_IP|IP_SET_HASH_NET|NETFILTER_XT_SET|TMPFS_POSIX_ACL|TMPFS_XATTR|NETFILTER_XT_MATCH_ADDRTYPE)=" gki_defconfig

      - name: Build kernel (build.sh, clang-r416183b)
        run: |
          cd $HOME/ak
          # cc-wrapper stub 复制到 O= 输出目录（OPPO Makefile 用相对路径包装 CC，从 OUT_DIR 解析）
          mkdir -p out/android12-5.10/scripts/basic
          cp common/scripts/basic/cc-wrapper out/android12-5.10/scripts/basic/ 2>/dev/null || \
            { printf '#!/bin/sh\nexec "$@"\n' > out/android12-5.10/scripts/basic/cc-wrapper && chmod +x out/android12-5.10/scripts/basic/cc-wrapper; }
          # SKIP_MRPROPER：realme 树多处引用被 strip 的私有目录（oplus_binder、kernelFwUpdate 等），
          # clean 会遍历所有 obj 目录（含未开启 CONFIG 的）导致失败；全新 OUT_DIR 无需 clean，
          # 编译阶段只处理已启用 CONFIG，不会碰这些目录
          # 跳过 savedefconfig 一致性检查：realme 树的 gki_defconfig 与上游存在固有差异
          # （缺 UBSAN/KASAN/KFENCE 等），check_defconfig 必失败。
          # 定义与调用断开：定义改名、调用点替换为 true
          # 先删除 export -f check_defconfig：否则会被下一轮替换成 "export -f true"，
          # bash 报 "export: true: not a function" 并中断 _setup_env.sh（run7 教训）
          grep -rl 'check_defconfig' "$HOME/ak/build" "$HOME/ak/common" 2>/dev/null | while read -r f; do
            sed -i '/export[[:space:]]*-f[[:space:]]*check_defconfig/d' "$f"
          done
          grep -rl 'check_defconfig()' "$HOME/ak/build" 2>/dev/null | while read -r f; do
            sed -i 's/\bcheck_defconfig()/__orig_check_defconfig()/g' "$f"
          done
          grep -rl 'check_defconfig' "$HOME/ak/build" "$HOME/ak/common" 2>/dev/null | while read -r f; do
            sed -i -E 's/\bcheck_defconfig\b/true/g' "$f"
          done
          echo "=== 残留 check_defconfig 引用（应为空）==="
          grep -rn 'check_defconfig' "$HOME/ak/build" "$HOME/ak/common" 2>/dev/null | grep -v '__orig_check_defconfig' | head -3
          echo "=== 中和完成 ==="
          SKIP_MRPROPER=1 BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Verify kernel release string against device expectation
        run: |
          DIST=$HOME/ak/out/android12-5.10/dist
          ls -la $DIST | head -30
          echo "=== 内核内嵌版本串 ==="
          strings $DIST/Image | grep -m1 "Linux version" || echo "Image 中未找到版本串"
          EXPECTED="5.10.226-android12-9-o-gca7e70f5a6e7"
          ACTUAL=$(strings $DIST/Image | grep -oPm1 '5\.10\.\d+-android12-\d+[^ ]*o-[0-9a-f]+' || true)
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ -n "$ACTUAL" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::warning::内核版本串与设备 vendor 模块 vermagic 不一致，刷入后模块可能拒绝加载"
          fi

      - name: Fallback build raw Image if missing
        if: always()
        run: |
          DIST=$HOME/ak/out/android12-5.10/dist
          if [ ! -f $DIST/Image ]; then
            cd $HOME/ak/common
            export PATH=$HOME/ak/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PATH
            make O=$HOME/ak/out/android12-5.10 ARCH=arm64 Image LLVM=1 \
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- -j$(nproc)
          fi
          test -f $DIST/Image || (echo "Image 构建失败" && exit 1)

      - name: Publish Image to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIST=$HOME/ak/out/android12-5.10/dist
          TAG="v$(date +%Y%m%d-%H%M%S)"
          cd $DIST
          gh release create "$TAG" Image Image.lz4 \
            --repo "$GITHUB_REPOSITORY" \
            --title "GKI kernel $TAG (5.10.226-android12-9 + Droidspaces)" \
            --notes "realme GT Neo5 240W (RMX3708) GKI 内核。源码: realme-kernel-opensource kernel-5.10.226 分支 + Droidspaces kABI 补丁（SYSVIPC/POSIX_MQUEUE）+ kABI 安全配置。预期版本串: 5.10.226-android12-9-o-gca7e70f5a6e7。仅用于 fastboot boot 测试，确认可开机后再刷入。"
